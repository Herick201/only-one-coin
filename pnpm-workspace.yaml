packages:
  - "apps/*"
  - "packages/*"

# esbuild e sharp compilam binario no postinstall; aprovados para rodar seus build scripts.
# As demais trazem binário pré-built (bindings nativos via optionalDependencies);
# não precisam rodar postinstall -> false (decisão explícita p/ o gate do pnpm 11).
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  # dependência opcional do ioredis (packages/queue) — tem fallback puro em JS
  msgpackr-extract: false
  sharp: true
  unrs-resolver: false
