name: Deploy apps/api (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/domain/**"
      - "packages/queue/**"
      - "packages/db/**"
      - "fly.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Só roda depois que o CI (typecheck/build/test/migration) já passou pro
  # mesmo commit — nunca faz deploy de algo que não passou pelo portão.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: wait-for-ci
          check-regexp: '(secrets-scan|build|test-api|migrations)'
          wait-interval: 10

  # CLAUDE.md §7: "Migration em produção sempre depois de backup." Este job
  # mecaniza a regra — backup sempre roda, e só se ele terminar OK a
  # migration roda em seguida. Não substitui o backup periódico do §3
  # ("pg_dump → Tigris via Scheduled Function", ainda não construído) — é
  # só o snapshot imediatamente antes de qualquer deploy que mude schema.
  backup-and-migrate:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # aws-cli já vem no runner. postgresql-client do repo padrão do
      # Ubuntu é pg16 — pg_dump recusa dump de servidor mais novo que ele
      # mesmo (Neon roda Postgres 18, mesma versão do compose.yml local).
      # Repo oficial da PGDG pra instalar o client 18 de verdade.
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Backup do Neon de produção para o Tigris
        run: |
          set -euo pipefail
          FILE="ooc-prod-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          pg_dump "$DATABASE_URL" | gzip > "$FILE"
          aws s3 cp "$FILE" "s3://${TIGRIS_BUCKET_NAME}/${FILE}" --endpoint-url "$AWS_ENDPOINT_URL_S3"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://t3.storage.dev
          # Nome do bucket não é segredo — só as credenciais são.
          TIGRIS_BUCKET_NAME: only-one-coin-backups

      - name: Migration contra o Neon de produção
        run: pnpm --filter @ooc/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: [wait-for-ci, backup-and-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # fly.toml fica na raiz do repo de propósito — o build context do
      # Dockerfile depende disso (ver comentário no próprio fly.toml).
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
