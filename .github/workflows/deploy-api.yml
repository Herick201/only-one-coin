name: Deploy apps/api (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/domain/**"
      - "packages/queue/**"
      - "packages/notifications/**"
      - "packages/ocr/**"
      - "packages/db/**"
      - "fly.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Só roda depois que o CI (typecheck/build/test/migration) já passou pro
  # mesmo commit — nunca faz deploy de algo que não passou pelo portão.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: wait-for-ci
          check-regexp: '(secrets-scan|build|test-api|migrations)'
          wait-interval: 10

  # Toda variável que o apps/api exige no boot (ConfigSchema sem default e
  # não opcional) tem que existir no Fly antes de qualquer coisa. Sem isso a
  # release nova cai no boot em loop até o Fly desistir e deixar a máquina
  # parada — e setar a secret depois não religa (03/10/2026,
  # TURNSTILE_SECRET_KEY). Roda antes do backup/migration: falhou aqui, nada
  # em produção foi tocado. Variável obrigatória nova = `fly secrets set`
  # ANTES do merge.
  check-secrets:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Variáveis obrigatórias do apps/api existem no Fly
        run: |
          set -euo pipefail
          required=$(pnpm --silent --filter @ooc/api env:required | sort -u)
          # Presente = secret do Fly ou chave do bloco [env] do fly.toml.
          present=$( { flyctl secrets list --json | jq -r '.[].name'
                       sed -n '/^\[env\]/,/^\[/p' fly.toml | grep -oE '^[[:space:]]*[A-Z0-9_]+[[:space:]]*=' | tr -d ' =' ; } | sort -u)
          missing=$(comm -23 <(echo "$required") <(echo "$present"))
          if [ -n "$missing" ]; then
            echo "::error::apps/api não sobe sem: $(echo $missing). Rode 'flyctl secrets set NOME=valor' e refaça o deploy (workflow_dispatch)."
            exit 1
          fi
          echo "As $(echo "$required" | wc -l) variáveis obrigatórias estão no Fly."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # CLAUDE.md §7: migrations in production always run after a backup. This
  # job enforces it — the backup always runs, and the migration only runs
  # if it succeeds. It is the project's only backup: the scheduled one was
  # dropped on 2026-10-07 (CLAUDE.md §3).
  backup-and-migrate:
    needs: [wait-for-ci, check-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # aws-cli já vem no runner. postgresql-client do repo padrão do
      # Ubuntu é pg16 — pg_dump recusa dump de servidor mais novo que ele
      # mesmo (Neon roda Postgres 18, mesma versão do compose.yml local).
      # Repo oficial da PGDG pra instalar o client 18 de verdade.
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Backup do Neon de produção para o Tigris
        run: |
          set -euo pipefail
          FILE="ooc-prod-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          # Caminho explícito, não fiar em PATH: o runner já vem com um
          # pg_dump 16 em /usr/bin (fora do update-alternatives da PGDG), e
          # instalar o postgresql-client-18 não sobrescreve esse binário.
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" | gzip > "$FILE"
          aws s3 cp "$FILE" "s3://${TIGRIS_BUCKET_NAME}/${FILE}" --endpoint-url "$AWS_ENDPOINT_URL_S3"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://t3.storage.dev
          # Nome do bucket não é segredo — só as credenciais são.
          TIGRIS_BUCKET_NAME: only-one-coin-backups

      - name: Migration contra o Neon de produção
        run: pnpm --filter @ooc/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: [wait-for-ci, backup-and-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # fly.toml fica na raiz do repo de propósito — o build context do
      # Dockerfile depende disso (ver comentário no próprio fly.toml).
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
