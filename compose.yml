services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ooc
      POSTGRES_PASSWORD: ooc
      POSTGRES_DB: ooc_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooc -d ooc_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
